<div class="login-container">
  <div class="login-card">
    <h2>Connexion Platform</h2>
    <p class="subtitle">Accédez à votre espace de formation</p>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="email">Adresse Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          placeholder="exemple@domaine.com"
          [class.input-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')" class="text-error">
          Veuillez saisir une adresse email valide.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="••••••••"
          [class.input-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Se connecter</span>
        <span *ngIf="isLoading">Connexion en cours...</span>
      </button>

    </form>
  </div>
</div>
